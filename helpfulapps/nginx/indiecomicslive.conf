# /etc/nginx/sites-available/indiecomicslive.conf
#
# Reverse proxy for indiecomicslive.com. Routes:
#   /         → Next.js on :3000
#   /ws       → WebSocket server on :3001 (chat + bids)
#
# scripts/install-systemd.sh templates the hostname into __APP_HOST__.

upstream icl_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream icl_ws {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Map for WebSocket upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP — redirect to HTTPS (certbot will inject the snippet to keep
# /.well-known/acme-challenge working for renewals).
server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__ www.__APP_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex / www on HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __APP_HOST__ www.__APP_HOST__;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/__APP_HOST__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__APP_HOST__/privkey.pem;

    # Security headers (defense in depth — Next.js also sets CSP/etc.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Real client IP for the bot blocker
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 50m;

    # Redirect www -> apex (toggle if you prefer the other direction)
    if ($host = www.__APP_HOST__) {
        return 301 https://__APP_HOST__$request_uri;
    }

    # WebSocket: chat + bids
    location /ws {
        proxy_pass http://icl_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://icl_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
